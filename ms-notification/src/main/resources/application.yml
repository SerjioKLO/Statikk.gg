server:
  port: 8086

spring:
  application:
    name: ms-notification
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:statikk_notification}?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:statikk}
    password: ${RABBITMQ_PASSWORD:statikk}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          # Sin timeouts, un SMTP caído dejaría colgado el hilo del listener
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

notification:
  mail:
    # Interruptor explícito: con false nunca se intenta enviar correo (aunque exista JavaMailSender)
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:notificaciones@statikk.gg}
  ws:
    # Orígenes permitidos para el handshake WebSocket. "*" solo para desarrollo.
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # El health de mail intenta conectarse al SMTP: sin servidor de correo marcaría todo el servicio como DOWN
    mail:
      enabled: false
