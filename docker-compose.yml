services:
  redis:
    image: redis:7-alpine
    container_name: statikk-redis
    ports:
      - "6379:6379"

  ms-registry:
    build: ./ms-registry
    container_name: ms-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: statikk-dev-secret-change-me-32chars-min
    depends_on:
      redis:
        condition: service_started
      ms-registry:
        condition: service_healthy

  mysql-auth:
    image: mysql:8.4
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: statikk_auth
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_NAME: statikk_auth
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: statikk-dev-secret-change-me-32chars-min
      JWT_EXPIRATION_MINUTES: 60
    depends_on:
      ms-registry:
        condition: service_healthy
      mysql-auth:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: statikk-rabbitmq
    environment:
      # OJO: con el usuario "guest" por defecto, RabbitMQ solo permite
      # conexiones AMQP desde localhost (loopback_users). Como ms-player
      # se conecta desde otro contenedor, usamos un usuario propio.
      RABBITMQ_DEFAULT_USER: statikk
      RABBITMQ_DEFAULT_PASS: statikk
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-player:
    image: mysql:8.4
    container_name: mysql-player
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: statikk_player
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-player:
    build: ./ms-player
    container_name: ms-player
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      DB_HOST: mysql-player
      DB_PORT: 3306
      DB_NAME: statikk_player
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: statikk
      RABBITMQ_PASSWORD: statikk
    depends_on:
      ms-registry:
        condition: service_healthy
      mysql-player:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  mysql-matches:
    image: mysql:8.4
    container_name: mysql-matches
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: statikk_matches
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-matches:
    build: ./ms-matches
    container_name: ms-matches
    ports:
      - "8083:8083"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      DB_HOST: mysql-matches
      DB_PORT: 3306
      DB_NAME: statikk_matches
      DB_USER: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: statikk
      RABBITMQ_PASSWORD: statikk
    depends_on:
      ms-registry:
        condition: service_healthy
      mysql-matches:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-player:
        condition: service_started

  ms-excel-parser:
    build: ./ms-excel-parser
    container_name: ms-excel-parser
    ports:
      - "8085:8085"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: statikk
      RABBITMQ_PASSWORD: statikk
    depends_on:
      ms-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-player:
        condition: service_started
      # ms-matches declara la cola "ms-matches.excel-imports"; si el parser publica antes
      # de que exista, RabbitMQ descarta el mensaje (no hay ninguna cola enlazada todavía).
      ms-matches:
        condition: service_started

  mysql-stats:
    image: mysql:8.4
    container_name: mysql-stats
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: statikk_stats
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-stats:
    build: ./ms-stats
    container_name: ms-stats
    ports:
      - "8084:8084"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      DB_HOST: mysql-stats
      DB_PORT: 3306
      DB_NAME: statikk_stats
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: statikk
      RABBITMQ_PASSWORD: statikk
      STATS_BATCH_INTERVAL_MS: 10000
    depends_on:
      ms-registry:
        condition: service_healthy
      mysql-stats:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      ms-matches:
        condition: service_started
      # ms-notification declara la cola "ms-notification.stats-events"; si ms-stats publica antes de que
      # exista, RabbitMQ descarta el mensaje (no hay ninguna cola enlazada todavía).
      ms-notification:
        condition: service_started

  # Servidor SMTP de pruebas: captura los correos en vez de enviarlos. Bandeja web en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: statikk-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  mysql-notification:
    image: mysql:8.4
    container_name: mysql-notification
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: statikk_notification
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-notification:
    build: ./ms-notification
    container_name: ms-notification
    ports:
      - "8086:8086"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      DB_HOST: mysql-notification
      DB_PORT: 3306
      DB_NAME: statikk_notification
      DB_USER: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: statikk
      RABBITMQ_PASSWORD: statikk
      MAIL_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      ms-registry:
        condition: service_healthy
      mysql-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-player:
        condition: service_started
      mailpit:
        condition: service_started
