server:
  port: 8083

spring:
  application:
    name: ms-matches
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:statikk_matches}?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:statikk}
    password: ${RABBITMQ_PASSWORD:statikk}
    listener:
      simple:
        # Sin esto, un mensaje que falla se reencola para siempre ("poison message").
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
  cloud:
    openfeign:
      client:
        config:
          default:
            # Si ms-player no responde en estos tiempos, Feign lanza excepción
            # y MatchService la convierte en un 503 controlado.
            connect-timeout: 2000
            read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
