server:
  port: 8085

spring:
  application:
    name: ms-excel-parser
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:statikk}
    password: ${RABBITMQ_PASSWORD:statikk}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

excel:
  # Máximo de partidas por archivo; evita eventos gigantes en RabbitMQ
  max-rows: ${EXCEL_MAX_ROWS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
