version: '3.8'

services:
  # ==========================================
  # Infrastructure Middleware
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: statikk-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - statikk-network

  redis:
    image: redis:7-alpine
    container_name: statikk-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - statikk-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: statikk-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - statikk-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: statikk-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - statikk-network

  # ==========================================
  # Core Platform Microservices
  # ==========================================
  ms-registry:
    build:
      context: .
      dockerfile: registry/Dockerfile
    container_name: ms-registry
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    networks:
      - statikk-network

  ms-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_URI: http://ms-registry:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - ms-registry
      - redis
    networks:
      - statikk-network

  ms-auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: ms-auth
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      EUREKA_URI: http://ms-registry:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-registry:
        condition: service_started
    networks:
      - statikk-network

  ms-player:
    build:
      context: .
      dockerfile: player/Dockerfile
    container_name: ms-player
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      EUREKA_URI: http://ms-registry:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      ms-registry:
        condition: service_started
    networks:
      - statikk-network

  ms-matches:
    build:
      context: .
      dockerfile: matches/Dockerfile
    container_name: ms-matches
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      EUREKA_URI: http://ms-registry:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-registry:
        condition: service_started
    networks:
      - statikk-network

  ms-stats:
    build:
      context: .
      dockerfile: stats/Dockerfile
    container_name: ms-stats
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      EUREKA_URI: http://ms-registry:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      ms-registry:
        condition: service_started
    networks:
      - statikk-network

  ms-excel-parser:
    build:
      context: .
      dockerfile: excel-parser/Dockerfile
    container_name: ms-excel-parser
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      EUREKA_URI: http://ms-registry:8761/eureka/
    depends_on:
      rabbitmq:
        condition: service_healthy
      ms-registry:
        condition: service_started
    networks:
      - statikk-network

  ms-notification:
    build:
      context: .
      dockerfile: notification/Dockerfile
    container_name: ms-notification
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      EUREKA_URI: http://ms-registry:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-registry:
        condition: service_started
    networks:
      - statikk-network

volumes:
  mysql_data:
  redis_data:

networks:
  statikk-network:
    driver: bridge
