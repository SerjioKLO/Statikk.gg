services:
  redis:
    image: redis:7-alpine
    container_name: statikk-redis
    ports:
      - "6379:6379"

  ms-registry:
    build: ./ms-registry
    container_name: ms-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: statikk-dev-secret-change-me-32chars-min
    depends_on:
      redis:
        condition: service_started
      ms-registry:
        condition: service_healthy

  mysql-auth:
    image: mysql:8.4
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: statikk_auth
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_NAME: statikk_auth
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: statikk-dev-secret-change-me-32chars-min
      JWT_EXPIRATION_MINUTES: 60
    depends_on:
      ms-registry:
        condition: service_healthy
      mysql-auth:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: statikk-rabbitmq
    environment:
      # OJO: con el usuario "guest" por defecto, RabbitMQ solo permite
      # conexiones AMQP desde localhost (loopback_users). Como ms-player
      # se conecta desde otro contenedor, usamos un usuario propio.
      RABBITMQ_DEFAULT_USER: statikk
      RABBITMQ_DEFAULT_PASS: statikk
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-player:
    image: mysql:8.4
    container_name: mysql-player
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: statikk_player
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-player:
    build: ./ms-player
    container_name: ms-player
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://ms-registry:8761/eureka/
      DB_HOST: mysql-player
      DB_PORT: 3306
      DB_NAME: statikk_player
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: statikk
      RABBITMQ_PASSWORD: statikk
    depends_on:
      ms-registry:
        condition: service_healthy
      mysql-player:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
