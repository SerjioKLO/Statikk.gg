server:
  port: 8080

spring:
  application:
    name: ms-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          # DESACTIVADO desde v0.7. Con "true", Gateway crea rutas automáticas /<servicio>/** (ej. /ms-player/**)
          # para todo lo registrado en Eureka: saltándose el rate limiting de las rutas explícitas de abajo
          # y exponiendo cualquier endpoint interno de un servicio. Todas las rutas necesarias ya están declaradas.
          enabled: false
      routes:
        # --- Estas rutas apuntan a servicios que aún no existen (llegan en v0.2+) ---
        # Quedan pre-cableadas para no tener que tocar el gateway en cada versión nueva.
        - id: ms-auth
          uri: lb://ms-auth
          predicates:
            - Path=/api/auth/**

        - id: ms-player
          uri: lb://ms-player
          predicates:
            - Path=/api/players/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: ms-matches
          uri: lb://ms-matches
          predicates:
            - Path=/api/matches/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: ms-excel-parser
          uri: lb://ms-excel-parser
          predicates:
            - Path=/api/excel/**
          filters:
            # Más estricto que el resto: cada upload implica parsear un archivo y publicar un evento grande
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@ipKeyResolver}"

        - id: ms-stats
          uri: lb://ms-stats
          predicates:
            - Path=/api/stats/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        - id: ms-notification
          uri: lb://ms-notification
          predicates:
            - Path=/api/notifications/**

        # WebSocket (STOMP nativo, sin SockJS). "lb:ws://" = balanceo por Eureka, pero con el esquema ws.
        # El token viaja en ?access_token=<JWT> (ver WebSocketTokenSupport) y se valida al conectar.
        - id: ms-notification-ws
          uri: lb:ws://ms-notification
          predicates:
            - Path=/ws/**
          filters:
            # Limita intentos de conexión por IP (cada handshake es una conexión abierta de larga vida)
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  # ⚠️ Cambiar en producción y usar el MISMO secreto en ms-auth (v0.2).
  secret: ${JWT_SECRET:statikk-dev-secret-change-me-32chars-min}
  public-paths: /api/auth/register,/api/auth/login,/api/excel/template,/actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
