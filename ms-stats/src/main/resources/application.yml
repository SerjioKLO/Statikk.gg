server:
  port: 8084

spring:
  application:
    name: ms-stats
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:statikk_stats}?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      # Sin esto Spring Boot ejecutaría el job una vez al arrancar; lo dispara el scheduler.
      enabled: false
    jdbc:
      # Crea las tablas BATCH_* de metadatos (historial de ejecuciones del job).
      initialize-schema: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:statikk}
    password: ${RABBITMQ_PASSWORD:statikk}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

stats:
  batch:
    # Cada cuántos ms revisa si hay jugadores pendientes de recalcular
    interval-ms: ${STATS_BATCH_INTERVAL_MS:10000}
    initial-delay-ms: ${STATS_BATCH_INITIAL_DELAY_MS:15000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
