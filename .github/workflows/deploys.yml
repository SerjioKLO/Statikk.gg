name: CI/CD Microservices ECR y SSM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ETAPA 1 a 4: Build, tag con SHA del commit y push a Amazon ECR
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { repo: "ms-registry",     dir: "registry" }
          - { repo: "ms-gateway",      dir: "gateway" }
          - { repo: "ms-auth",         dir: "auth" }
          - { repo: "ms-player",       dir: "player" }
          - { repo: "ms-matches",      dir: "matches" }
          - { repo: "ms-stats",        dir: "stats" }
          - { repo: "ms-excel-parser", dir: "excel-parser" }
          - { repo: "ms-notification", dir: "notification" }

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Build y push con SHA
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ matrix.service.repo }}
        run: |
          IMAGE="$REGISTRY/$REPO:$IMAGE_TAG"
          docker build -t "$IMAGE" -f ${{ matrix.service.dir }}/Dockerfile .
          docker push "$IMAGE"

  # ETAPA 5: Despliegue automatizado vía AWS SSM en las 3 EC2 (sin SSH)
  deploy-ssm:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # Orden estricto: 1° EC2 Core (Eureka/DB), 2° EC2 Domain, 3° EC2 Workers
      matrix:
        instance:
          - { name: "EC2-1-Core",    id: "${{ secrets.INSTANCE_ID_NODE1 }}" }
          - { name: "EC2-2-Domain",  id: "${{ secrets.INSTANCE_ID_NODE2 }}" }
          - { name: "EC2-3-Workers", id: "${{ secrets.INSTANCE_ID_NODE3 }}" }

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR para obtener Registry URL
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 5. Deploy via SSM (con tag SHA exacto)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ssm send-command \
            --instance-ids "${{ matrix.instance.id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"cd /home/ubuntu/app\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"export ECR_REGISTRY=$REGISTRY\",
              \"export IMAGE_TAG=$IMAGE_TAG\",
              \"docker compose pull\",
              \"docker compose up -d --remove-orphans\"
            ]"