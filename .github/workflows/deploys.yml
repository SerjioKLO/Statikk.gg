name: CI/CD Microservices ECR y SSM

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - repo: ms-registry
            dir: registry
          - repo: ms-gateway
            dir: api-gateway
          - repo: ms-auth
            dir: auth
          - repo: ms-player
            dir: player
          - repo: ms-matches
            dir: matches
          - repo: ms-stats
            dir: stats
          - repo: ms-excel-parser
            dir: excel-parser
          - repo: ms-notification
            dir: notification

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push con SHA
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ matrix.service.repo }}
        run: |
          IMAGE="$REGISTRY/$REPO:$IMAGE_TAG"
          docker build -t "$IMAGE" -f "${{ matrix.service.dir }}/Dockerfile" .
          docker push "$IMAGE"

  deploy-ssm:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        instance:
          - name: EC2-1-Core
            secret_name: INSTANCE_ID_NODE1
          - name: EC2-2-Domain
            secret_name: INSTANCE_ID_NODE2
          - name: EC2-3-Workers
            secret_name: INSTANCE_ID_NODE3

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSM
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets[matrix.instance.secret_name] }}
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","cd /home/ubuntu/app","aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$REGISTRY"'","export ECR_REGISTRY='"$REGISTRY"'","export IMAGE_TAG='"$IMAGE_TAG"'","docker compose pull","docker compose up -d --remove-orphans"]'
